server:
  port: 8080
  tomcat:
    connection-timeout: 20000
    max-threads: 200

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/village_db?useSSL=true&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  # Redis 配置（用于二维码动态码缓存）
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: 0
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.scau.village.module.**.entity
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

jwt:
  secret: ${JWT_SECRET:please_change_this_secret_in_production}
  expiration: 604800000
  header: Authorization

# ✅ 微信小程序配置（已填入真实值）
wechat:
  appid: wx61aaa25802e6d8a2
  secret: 892b4c7ecb1c4ccb5de9eb8d8dd8487e

# 图片访问前缀配置（生产环境使用 HTTPS，请替换为实际域名）
image:
  url-prefix: https://api.yourdomain.com

warning:
  no-apply-days: 14
  participation-drop-rate: 0.5

# 生产环境关闭 API 文档
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

# 日志级别配置（便于生产环境调试）
logging:
  level:
    com.scau.village: DEBUG
    org.springframework.web: INFO
    org.springframework.security: INFO