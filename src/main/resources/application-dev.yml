server:
  port: 8080

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/village_db?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123456
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  main:
    allow-bean-definition-overriding: true
  # Redis 配置（用于二维码动态码缓存）
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.scau.village.module.**.entity
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

jwt:
  secret: villageSecretKey2026SecureEnough123!@#
  expiration: 604800000
  header: Authorization

# ✅ 微信小程序配置（已填入真实值）
wechat:
  appid: wx61aaa25802e6d8a2
  secret: 892b4c7ecb1c4ccb5de9eb8d8dd8487e

# aliyun:
#   oss:
#     endpoint: oss-cn-shenzhen.aliyuncs.com
#     access-key-id: 你的AK
#     access-key-secret: 你的SK
#     bucket-name: village-images
#     url-prefix: https://你的bucket.oss-cn-shenzhen.aliyuncs.com/

# 图片访问前缀配置（开发环境使用 HTTP）
image:
  url-prefix: http://localhost:8080

warning:
  no-apply-days: 14
  participation-drop-rate: 0.5

knife4j:
  enable: true
  production: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.scau.village: DEBUG
    org.springframework.web: DEBUG